<meta name="description" content="Tamanna: an open idea platform where people post products they wish existed and factories build them.">
<style>
/* Layout: sticky header + single centered feed column (users, mobile-first); wide table + side panel in Factory mode (desktop-first). */
:root{
  --bg:#F7F7F4; --surface:#FFFFFF; --surface-2:#F2F1F7; --fg:#1B1A2E; --muted:#67667B; --line:#E5E4EE;
  --pri:#1E1B4B; --on-pri:#FFFFFF; --pri-soft:#EAE9F8;
  --wish:#F59E0B; --on-wish:#3A2300; --wish-ink:#8A4B06; --wish-soft:#FEF4DA;
  --like:#16A34A; --dislike:#DC2626; --on-solid:#FFFFFF;
  --verify:#0369A1; --verify-soft:#E0F2FE;
  --focus:#6366F1; --ai:#6D28D9; --ai-soft:#F3EEFF;
  --font:system-ui,-apple-system,"Segoe UI","SF Arabic","Noto Sans Arabic","Geeza Pro","PingFang SC","Microsoft YaHei","Noto Sans SC",Tahoma,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100F1E; --surface:#1A1930; --surface-2:#22213B; --fg:#ECEBF7; --muted:#A3A1BD; --line:#2D2B4B;
  --pri:#C9C6FF; --on-pri:#15133A; --pri-soft:#2A2852;
  --wish:#FBBF24; --on-wish:#2B1A00; --wish-ink:#FCD34D; --wish-soft:#33270D;
  --verify:#7DD3FC; --verify-soft:#0B2A3D; --focus:#A5B4FC; --ai:#C4B5FD; --ai-soft:#2A2145; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100F1E; --surface:#1A1930; --surface-2:#22213B; --fg:#ECEBF7; --muted:#A3A1BD; --line:#2D2B4B;
  --pri:#C9C6FF; --on-pri:#15133A; --pri-soft:#2A2852;
  --wish:#FBBF24; --on-wish:#2B1A00; --wish-ink:#FCD34D; --wish-soft:#33270D;
  --verify:#7DD3FC; --verify-soft:#0B2A3D; --focus:#A5B4FC; --ai:#C4B5FD; --ai-soft:#2A2145; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.num,.tnum{font-variant-numeric:tabular-nums}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--fg)}
.logo{width:34px;height:34px;display:block;flex:none}
.logo svg{width:34px;height:34px;display:block}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.dnav{display:flex;gap:4px;margin-inline-start:12px}
.dnav button{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:10px;font-weight:600;color:var(--muted);position:relative}
.dnav button:hover{background:var(--surface-2);color:var(--fg)}
.dnav button.on{background:var(--pri-soft);color:var(--pri)}
.hdr-act{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.icon-btn{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;padding:0 10px}
.icon-btn:hover{border-color:var(--muted)}
.badge-n{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--wish);color:var(--on-wish);font-size:11px;font-weight:800;display:inline-grid;place-items:center;line-height:1}
.badge-n:empty{display:none}
.dot{position:absolute;top:5px;inset-inline-end:5px;width:8px;height:8px;border-radius:50%;background:var(--verify);border:2px solid var(--bg)}
.tabs{max-width:1280px;margin:0 auto}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.tab{padding:11px 6px 12px;font-weight:700;color:var(--muted);position:relative;font-size:15px;white-space:nowrap}
@media (max-width:420px){.tab{font-size:13.5px;padding-inline:4px}}
.tab.on{color:var(--fg)}
.tab.on::after{content:"";position:absolute;inset-inline:22%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--wish)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 18px;border-radius:11px;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
.btn.pri{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{color:var(--dislike);border-color:currentColor;background:transparent}
.link{color:var(--pri);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}

main{max-width:1280px;margin:0 auto;padding-block:16px 110px}
/* Content spans the same width as the header (up to 1280px). On wide screens the feed becomes two columns so text lines stay comfortable to read. */
.col{max-width:none;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* Hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px 16px;display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.01em}
.hero-t p{color:var(--muted);margin-top:6px;max-width:58ch}
.story{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.story li{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;font-size:13px;font-weight:600;color:var(--muted)}
.story li:not(:last-child)::after{content:"";position:absolute;top:27px;inset-inline-start:calc(50% + 32px);inset-inline-end:calc(-50% + 30px);border-top:2px dashed var(--line)}
.story .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--pri);border:1.5px solid var(--line);animation:beat 6s infinite;animation-delay:calc(var(--k) * 1.5s)}
.story .ic svg{width:24px;height:24px}
@keyframes beat{0%,20%{transform:scale(1.1);background:var(--wish);border-color:var(--wish);color:var(--on-wish)}28%,100%{transform:none}}
.hero .hide{align-self:flex-start}
.hero-mini{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:14px}
.hm-steps{display:flex;align-items:center;gap:4px;color:var(--pri)}
.hm-steps i{width:10px;border-top:1.5px dashed var(--muted)}
.hm-steps svg{width:17px;height:17px}
.hm-steps span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;animation:beat 6s infinite;animation-delay:calc(var(--k) * 1.5s)}
.hero-mini[data-act="hero-peek"]{cursor:pointer}
.hero-mini[data-act="hero-peek"]:hover{border-color:var(--wish)}
.hero.peek{animation:unfold .3s ease-out;transform-origin:top center}
.hero.fold{animation:foldup .26s ease-in forwards}
.hero[data-act="hero-tap"]{cursor:pointer}
@keyframes unfold{from{opacity:0;transform:scaleY(.85)}}
@keyframes foldup{to{opacity:0;transform:scaleY(.85)}}
/* Share, demand, pledges */
.share-img{width:100%;max-width:420px;align-self:center;border-radius:16px;display:block;box-shadow:0 6px 24px rgba(10,9,25,.25)}
.demand{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.demand h3{display:flex;gap:6px;align-items:center;margin:0 0 2px}
.bar-row{display:grid;grid-template-columns:minmax(80px,120px) 1fr 40px;gap:8px;align-items:center;font-size:13px}
.pct-bar{height:8px;border-radius:9px;background:var(--surface);overflow:hidden}
.pct-bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.bar-row b{text-align:end}
.pledge-stat{font-size:13px;font-weight:700;color:var(--wish-ink);background:var(--wish-soft);border-radius:10px;padding:9px 12px}
.wish-item{display:flex;flex-direction:column;gap:10px;min-width:0}
.pledge.ask{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start;border:1.5px dashed var(--wish);background:var(--wish-soft);border-radius:14px;padding:12px 14px;font-weight:700;color:var(--wish-ink)}
.dot-in{width:9px;height:9px;border-radius:50%;background:var(--dislike);flex:none}
.pledge.open{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1.5px solid var(--wish);border-radius:14px;padding:14px 16px}
.pledge.done{display:flex;gap:10px;align-items:center;font-size:13.5px;font-weight:700;color:var(--wish-ink);padding:2px 4px}
.pledge.match{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--verify-soft);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px}
.only-you{font-size:11.5px;font-weight:700;color:var(--pri);background:var(--pri-soft);border-radius:8px;padding:3px 8px;align-self:flex-start}
.hm-t{color:var(--muted);flex:1;min-width:12ch}

/* Composer */
/* Share buttons in each network's own brand colour, so they're recognised at a glance */
.wa-btn{background:#25D366;border-color:#25D366;color:#FFFFFF;text-decoration:none}
.x-btn{background:#000000;border-color:#3A3A3A;color:#FFFFFF;text-decoration:none}
.snap-btn{background:#FFFC00;border-color:#FFFC00;color:#111111;text-decoration:none}
.ig-btn{background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF);border-color:transparent;color:#FFFFFF}
.ig-btn:hover{filter:brightness(1.08)}
.ig-step{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-weight:600}
.wa-btn:hover,.x-btn:hover,.snap-btn:hover{filter:brightness(1.08)}
.compose-row{display:flex;gap:10px;align-items:stretch}
.compose-row .compose-bar{flex:1;min-width:0}
.invite-btn{display:inline-flex;align-items:center;gap:8px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--pri);font-weight:700;font-size:14px;flex:none}
.invite-btn:hover{border-color:var(--pri)}
@media (max-width:640px){.invite-btn span{display:none}.invite-btn{padding:0 14px}}
.compose-bar{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border-radius:14px;border:1.5px dashed var(--line);background:var(--surface);color:var(--muted);font-weight:600;text-align:start}
.compose-bar:hover{border-color:var(--pri);color:var(--pri)}
.compose-bar .pl{width:30px;height:30px;border-radius:9px;background:var(--wish);color:var(--on-wish);display:grid;place-items:center;flex:none}
.compose-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.compose-h b{display:flex;align-items:center;gap:8px;font-size:15.5px}
.compose-h b svg{color:var(--wish)}
.compose{background:var(--surface);border:1.5px solid var(--pri);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:grow .2s ease-out}
@keyframes grow{from{opacity:.4;transform:translateY(-6px)}}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld textarea,.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--bg);font-size:15px;font-weight:500;color:var(--fg)}
.fld textarea{resize:vertical;min-height:96px;line-height:1.6}
.fld input:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--pri)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{display:flex;gap:6px;border:0;padding:0;margin:0;flex-wrap:wrap;align-items:center}
.who legend{font-size:13px;font-weight:700;color:var(--muted);padding:0;margin-bottom:6px;width:100%}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0}
.pill span{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.pill input:checked+span{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.pill input:focus-visible+span{outline:2.5px solid var(--focus);outline-offset:2px}
.upl{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:10px;border:1.5px dashed var(--line);font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.upl:hover{border-color:var(--pri);color:var(--pri)}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.prev{position:relative;width:96px}
.prev img{border-radius:10px;display:block;aspect-ratio:1;object-fit:cover;width:96px}
.prev button{position:absolute;top:-8px;inset-inline-end:-8px;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);font-weight:800;line-height:1}
.open-note{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px}
.open-note svg{flex:none;margin-top:2px}
.similar{background:var(--wish-soft);border-radius:11px;padding:10px 12px;font-size:13.5px}
.similar p{font-weight:700;color:var(--wish-ink);margin-bottom:6px}
.similar ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.similar button{text-align:start;color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.similar small{color:var(--muted);font-weight:500}
.err{color:var(--dislike);font-size:13px;font-weight:600}
.similar.dup{border:1.5px solid var(--dislike)}
.similar.dup>p{color:var(--dislike)}
.diff-f textarea{border-color:var(--wish)}
.sim-note{font-size:13px;background:var(--surface-2);border-radius:10px;padding:8px 12px;line-height:1.6}
.sim-note a{color:var(--pri);font-weight:700}

/* Card */
.feed{display:flex;flex-direction:column;gap:22px}
/* Two-column feed: cards in a row share one height (the taller one sets it). Extra space goes to the text area,
   so the poll and buttons line up at the bottom of both cards. "Read more" grows the row, and its neighbour with it. */
@media (min-width:1100px){
 .feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:24px}
 .feed>.card{grid-template-rows:1fr auto auto auto}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1fr) 176px;grid-template-areas:"main side" "poll poll" "act act" "dr dr";content-visibility:auto;contain-intrinsic-size:auto 340px}
.card.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{box-shadow:0 0 0 3px var(--wish)}100%{box-shadow:0 0 0 0 transparent}}
.c-main{grid-area:main;padding:22px 24px 16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.c-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.av{width:26px;height:26px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.c-meta b{color:var(--fg);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.chip.mine{background:var(--pri-soft);color:var(--pri)}
.chip.ok{background:var(--like);color:var(--on-solid)}
.c-title{font-size:18px;font-weight:800;line-height:1.4}
.c-img{border-radius:11px;max-height:340px;width:100%;object-fit:cover;background:var(--surface-2)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.plan{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.plan.hl{border:1.5px solid var(--pri);background:var(--pri-soft)}
.plan .pr{font-size:22px;font-weight:800}.plan .pr small{font-size:12px;font-weight:500;color:var(--muted)}
.plan ul{margin:0;padding-inline-start:18px;font-size:13px;line-height:1.7}
.terms{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.75}
.terms h3{font-size:15px;margin:10px 0 0}.terms p,.terms ul{margin:0}.terms ul{padding-inline-start:20px}
.promo{display:flex;flex-direction:column;gap:10px}.promo input[type=range]{width:100%;accent-color:var(--pri)}
.promo-sum{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.8}.promo-sum p{margin:0}.promo-tot{font-size:17px}
.cert{display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center}
.cert.ok{border:2px solid #16A34A;border-radius:16px;padding:16px}.cert.bad{border:2px solid #DC2626;border-radius:16px;padding:16px}
.cert-seal{width:56px;height:56px;border-radius:50%;background:#16A34A;color:#fff;font-size:30px;font-weight:900;display:grid;place-items:center}
.cert-fac{font-size:16px;margin:0}.cert-l{list-style:none;padding:0;margin:0;font-size:14px;line-height:1.9}.cert .c-img{max-height:220px}
.badge-note{font-size:12.5px;line-height:1.6;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin:0}
.lic-l{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}.lic-l li{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.adm{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}.adm h3{font-size:15px;margin:0}
.rep{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.rep-imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rep-imgs a{display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none}.rep-imgs img{width:100%;height:150px;object-fit:cover;border-radius:8px;background:var(--surface-2)}
.qr-safe{margin:4px 0 0;font-size:13px;line-height:1.6;font-weight:600;color:#16A34A}
.notify-h{border:1.5px solid #F59E0B;background:rgba(245,158,11,.1);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.7;margin:0}
.soon-n{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:13px;margin:0}
.acct{border:1.5px solid var(--pri);background:var(--pri-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.acct.ok{border-color:var(--line);background:var(--surface);flex-direction:row;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px}
.off-b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#1D9BF0;color:#fff;font-size:10px;font-weight:900;vertical-align:-2px;margin-inline-start:2px}
.gal-w{position:relative}
.gal{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:11px;overscroll-behavior-x:contain}
.gal::-webkit-scrollbar{display:none}
.gal .c-img{flex:0 0 100%;scroll-snap-align:center;height:340px;max-height:none;object-fit:contain}
.gal-n{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;pointer-events:none}
.gal-b{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center}
.gal-b.prev-b{left:8px}.gal-b.next-b{right:8px}
@media (hover:none){.gal-b{display:none}}
.c-desc{color:var(--fg);opacity:.9;white-space:pre-line;overflow-wrap:anywhere}
/* Live site, milestone 1: marketplace & factory tools are still demo-only, so they stay hidden */
body.live [data-act="skip"],body.live .msec:has([data-act="reset"]),body.live .fac-top .seg:has([data-act="f-tab"]),
/* live: prices in EUR only, no gift codes/discount codes yet, the seller name comes from the factory profile, payment happens at Mollie */
body.live .giftf,body.live .fld:has(#mk-c),body.live .fld:has(#mk-f),body.live details:has(#d-c),body.live #payBlock,body.live .fld:has(#codeIn),body.live form[data-form="buy"] .demo{display:none!important}
.adds{display:flex;flex-direction:column;gap:6px}.add{border-inline-start:3px solid var(--pri);padding:4px 10px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.fnote{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;background:var(--surface-2)}
.fnote.pend{border-style:dashed;border-color:var(--pri)}.fn-h{margin:0;font-weight:700}.fn-t{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.fn-v{font-size:12.5px;color:var(--muted)}.fn-v.ok{color:#16A34A;font-weight:600}.fn-v.no{color:#DC2626}
.rev{border:1px dashed var(--line);border-radius:12px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.rev-h{color:var(--muted);margin:0}.rev summary{cursor:pointer;color:var(--pri);font-weight:600}
.rev-o{white-space:pre-line;margin:6px 0 0;display:flex;flex-direction:column;gap:2px;opacity:.9}.rev-list{color:var(--muted);font-size:12px;margin:6px 0 0}
.c-desc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{align-self:flex-start;color:var(--pri);font-weight:700;font-size:14px}
.c-side{grid-area:side;padding:22px 18px;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;line-height:1.3}
.badge.ver{background:var(--verify-soft);color:var(--verify)}
.badge.open{background:var(--surface-2);color:var(--muted)}
.badge.priv{background:var(--pri-soft);color:var(--pri)}
.stat-mini{font-size:13px;color:var(--muted)}
.stat-mini b{color:var(--fg)}
.buy{display:flex;align-items:center;gap:7px;width:100%;padding:10px 11px;border-radius:11px;background:var(--pri);color:var(--on-pri);font-weight:700;font-size:13.5px;text-align:start;line-height:1.35}
.buy:hover{filter:brightness(1.12)}
.buy svg{flex:none}
.price{font-weight:800;font-size:16px}
.price small{font-weight:500;color:var(--muted);font-size:12px;display:block}
.fac-name{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--fg)}

.poll{grid-area:poll;margin:6px 20px 2px;padding:20px 22px;background:var(--wish-soft);border-radius:16px;display:flex;flex-direction:column;gap:16px}
.poll-q{font-weight:700;font-size:15.5px}
.poll-btns{display:flex;gap:12px}
.poll .pb{min-height:50px}
.pb{flex:1;min-height:46px;border-radius:11px;border:1.5px solid var(--wish);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s}
.pb:active{transform:scale(.96)}
.pb.y{background:var(--wish);color:var(--on-wish)}
.pb.n{background:var(--surface);border-color:var(--line);color:var(--fg)}
.poll.voted .pb:not(.sel){background:transparent;border-color:var(--line);color:var(--muted)}
.poll.voted .pb.n.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.res{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;background:var(--wish);border-radius:99px}
.res-t{font-size:13px;color:var(--wish-ink)}
.res-t b{font-size:15px}

.c-actions{grid-area:act;display:flex;gap:10px;padding:18px 20px 22px;flex-wrap:wrap;align-items:center}
.ab{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-weight:600;font-size:13.5px;transition:transform .12s}
.ab:active{transform:scale(.93)}
.ab.like:not(.on):hover{border-color:var(--like);color:var(--like)}
.ab.dis:not(.on):hover{border-color:var(--dislike);color:var(--dislike)}
.ab.like.on{background:var(--like);border-color:var(--like);color:var(--on-solid)}
.ab.dis.on{background:var(--dislike);border-color:var(--dislike);color:var(--on-solid)}
.ab[aria-expanded="true"]{background:var(--pri-soft);border-color:var(--pri-soft);color:var(--pri)}
.ab.edit{margin-inline-start:auto;color:var(--pri);border-color:var(--pri-soft)}
.pop{animation:pop .3s}
@keyframes pop{45%{transform:scale(1.16)}}
.drawer{grid-area:dr;border-top:1px solid var(--line);padding:12px 16px 16px;background:var(--surface-2);border-radius:0 0 var(--r) var(--r);display:flex;flex-direction:column;gap:12px}
.sug-f{display:flex;gap:8px}
.sug-f .inp{flex:1;min-width:0;background:var(--surface)}
.cms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cm{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:14px}
.cm.adopted{border-color:var(--like)}
.cm-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:2px;flex-wrap:wrap}
.cm-h b{color:var(--fg)}
.cm-h .link{margin-inline-start:auto;font-size:12.5px}
.cm-h .chip{margin-inline-start:auto}
.cms .empty{color:var(--muted);font-size:14px;text-align:center;padding:6px}
.hist{font-size:13px}
.hist b{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.hist ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.hist time{margin-inline-start:6px;opacity:.75}
.edit{display:flex;flex-direction:column;gap:10px}

@media (max-width:640px){
  .card{grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "side" "poll" "act" "dr"}
  .c-main{padding:18px 18px 12px}
  .c-side{border-inline-start:0;padding:0 18px 16px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .c-side .buy{width:auto}
  .poll{margin:4px 12px 2px;padding:16px 16px}
  .c-actions{padding:16px 14px 18px}
  .ab{padding:0 11px}
}

/* Wishlist */
.wl-h{display:flex;flex-direction:column;gap:4px;padding-block:4px}
.wl-h h2{font-size:24px;font-weight:800}
.avail{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--verify-soft);color:var(--verify);font-weight:700}
.sentinel{height:1px}.sentinel.busy{height:48px;background:radial-gradient(circle,var(--muted) 3px,transparent 4px) center/18px 18px no-repeat;opacity:.6;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.15}}
.empty-box{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty-box svg{width:34px;height:34px;color:var(--wish)}

/* Factory mode */
.fac{display:flex;flex-direction:column;gap:14px}
.fac-top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.fac-top h2{font-size:24px;font-weight:800}
.fac-top .muted{font-size:14px}
.fac-tools{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{padding:7px 13px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.srch{position:relative}
.srch svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:10px;color:var(--muted)}
.srch input{padding-inline-start:34px;min-width:220px;min-height:40px;background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:start;min-width:0;display:flex;flex-direction:column;gap:2px;transition:border-color .15s}
.kpi:hover{border-color:var(--pri)}
.kpi.attn{border-color:var(--wish);background:var(--wish-soft)}
.kpi b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;min-width:0}
.kpi small{font-weight:700;color:var(--fg);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-stats{font-size:13.5px;font-weight:700;color:var(--wish-ink)}
.fac-body{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--surface);text-align:start;font-size:12px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;padding:0}
th button{display:flex;align-items:center;gap:4px;width:100%;padding:11px 12px;font-weight:700;text-align:start}
th button.on{color:var(--fg)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--pri-soft)}
.t-idea{min-width:190px}
.t-idea b{display:block;font-weight:700;line-height:1.4}
.t-idea small{color:var(--muted);font-size:12px}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.pct{display:inline-block;width:46px;height:6px;border-radius:9px;background:var(--surface-2);vertical-align:middle;margin-inline-end:6px;overflow:hidden}
.pct i{display:block;height:100%;background:var(--wish)}
.vel{color:var(--like)}
.fac-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:76px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 96px);overflow:auto}
.fac-panel h3{font-size:18px;font-weight:800}
.p-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.p-stats div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.p-stats b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.p-stats span{font-size:12px;color:var(--muted)}
.p-sugs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.p-sugs li{border-inline-start:3px solid var(--line);padding-inline-start:9px}
.p-empty{color:var(--muted);text-align:center;padding:40px 10px}
@media (max-width:1099px){.fac-body{grid-template-columns:minmax(0,1fr)}.fac-panel{display:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.srch input{min-width:0;width:100%}.fac-tools{width:100%}.srch{flex:1}}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.mb{position:absolute;inset:0;background:rgba(10,9,25,.5);animation:fade .15s}
.sheet{position:relative;background:var(--surface);border-radius:18px;width:min(560px,calc(100% - 32px));max-height:min(88vh,860px);overflow:auto;padding:22px 20px 20px;animation:up .2s ease-out;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px;font-weight:800;padding-inline-end:36px}
.sheet h3{font-size:14px;font-weight:800;margin-bottom:8px}
.x{position:absolute;top:12px;inset-inline-end:12px;width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-size:20px;line-height:1;z-index:2}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:.5}}
@media (max-width:640px){
  .modal{align-items:flex-end}
  .sheet{width:100%;border-radius:20px 20px 0 0;max-height:92vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
}
.m-card .card{border:0;content-visibility:visible}
.m-card .c-side{border:0}
.tiers{display:flex;flex-direction:column;gap:8px}
.tier{position:relative;display:block;cursor:pointer}
.tier input{position:absolute;opacity:0}
.tier>span{display:flex;flex-direction:column;gap:3px;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px}
.tier input:checked+span{border-color:var(--pri);background:var(--pri-soft)}
.tier input:focus-visible+span{outline:2.5px solid var(--focus);outline-offset:2px}
.tier small{color:var(--muted);font-size:13px}
.reach{font-style:normal;display:flex;gap:6px;align-items:center;font-weight:700;color:var(--wish-ink);font-size:13.5px;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fee{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:9px 12px}
.qty{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;overflow:hidden}
.step button{width:40px;height:38px;font-size:18px;font-weight:700}
.step output{min-width:34px;text-align:center;font-weight:800}
.pay{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.pay legend{font-weight:800;font-size:14px;margin-bottom:8px;padding:0}
.pm{position:relative;display:block;cursor:pointer}
.pm input{position:absolute;opacity:0}
.pm>span{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700}
.pm input:checked+span{border-color:var(--pri);background:var(--pri-soft)}
.pm input:focus-visible+span{outline:2.5px solid var(--focus);outline-offset:2px}
.logo-chip{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:52px;height:28px;padding:0 7px;border-radius:6px;background:#FFFFFF;border:1px solid #D9D9E3;font-size:12px;font-weight:800;color:#111111;flex:none}
.lc-apple{background:#000000;color:#FFFFFF;border-color:#000000}
.lc-pp b{color:#003087}.lc-pp i{color:#0079C1;font-style:normal}
.lc-visa{color:#1A1F71;font-style:italic;letter-spacing:.02em}
.lc-mc{gap:0}.lc-mc i{width:15px;height:15px;border-radius:50%;background:#EB001B;display:block}.lc-mc i+i{background:#F79E1B;margin-inline-start:-6px;opacity:.9}
.sum{margin:0;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.sum div{display:flex;justify-content:space-between}
.sum dt{color:var(--muted)}
.sum dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.sum .tot{font-size:17px;padding-top:4px}
.sum .tot dt{color:var(--fg);font-weight:800}
.demo{font-size:12.5px;color:var(--muted);text-align:center}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:16px 0}
.done svg{width:52px;height:52px;color:var(--like)}
.keybox{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--wish-soft);border-radius:12px;padding:12px 14px}
.keybox code{font:800 18px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--wish-ink);user-select:all;direction:ltr}
.mine-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mine-list li{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;font-size:14px;border:1px solid var(--line);border-radius:11px;padding:8px 12px}
.mine-list code{font:700 13px ui-monospace,Consolas,monospace;direction:ltr;user-select:all;color:var(--wish-ink)}
.msec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}

/* Private suggestions */
.cm.pending{border-style:dashed;border-color:var(--wish)}
.sec-l{font-size:12.5px;font-weight:800;color:var(--muted)}
.sug-note{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.sug-note svg{flex:none;margin-top:2px;width:15px;height:15px}
.cm-act{margin-top:8px}
.ab .badge-n{margin-inline-start:2px}
/* AI translation */
.ai{display:flex;flex-direction:column;gap:6px}
.ai-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ai);padding:5px 11px;border-radius:99px;background:var(--ai-soft)}
.ai-btn:hover{filter:brightness(.96)}
.ai-btn svg{width:15px;height:15px}
.ai-box{border-inline-start:3px solid var(--ai);background:var(--ai-soft);border-radius:10px;padding:9px 12px;font-size:14px}
.ai-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ai);margin-bottom:4px}
.ai-h svg{width:14px;height:14px}
.ai-h .link{margin-inline-start:auto;font-size:12px}
.ai-t{white-space:pre-line;color:var(--fg);overflow-wrap:anywhere}
.ai-disc{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.lang-pop .lp-disc{font-size:11.5px;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}

.ai-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ai-lbl{flex-basis:100%;font-size:12.5px;font-weight:700;color:var(--muted)}
/* ideas come in any language: each title/description follows its own writing direction */
.c-title,.c-desc,.mi-title,.mini b,.ai-t,.cm-t{unicode-bidi:plaintext;text-align:start}
.fac-link{font-size:inherit;font-weight:700;color:var(--pri)}
.thr-main .fac-link,h2 .fac-link{font-size:inherit}
.ai-btn.g{color:var(--verify);background:var(--verify-soft);text-decoration:none}
/* Gift + options + checkout */
.giftf{display:flex;flex-direction:column;gap:6px;background:var(--wish-soft);border-radius:12px;padding:10px 12px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--pri);width:16px;height:16px;flex:none}
.chk span{display:flex;gap:6px;align-items:flex-start}
.chk.sub{padding-inline-start:24px;font-weight:500}
.buy.gift{background:var(--wish);color:var(--on-wish)}
.code-row{display:flex;gap:8px}
.code-row .inp{flex:1;min-width:0}
.ok-t{color:var(--like);font-weight:700;font-size:13.5px}
#codeMsg{font-size:13px;min-height:1em}
select.inp{appearance:auto}
/* Orders */
.orders{display:flex;flex-direction:column;gap:12px;max-width:820px}
.ord{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.addr{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:14px}

const STOP=new Set('على الى إلى من في عن مع هذا هذه التي الذي يمكن لكي حتى كل بدون عند the and for with that this your you can from into when what'.split(' '));
/* Normalise before comparing: strip Arabic diacritics/tatweel and unify letter variants, so "تجف" matches "تجفّ" */
const tok=s=>s.toLowerCase().replace(/[ً-ْٰـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).map(x=>x.replace(/^(وال|بال|لل|ال)/,'')).filter(x=>x.length>=3&&!STOP.has(x));

/* Duplicate guard:compares the draft's title + description with every idea (both languages of seeded ideas).
   >=75% match: can't be posted (vote or suggest instead). 45-75%: allowed only with a written difference; the idea then links to the older one, which keeps priority and credit. */
const DUP=0.75,SIM=0.45;
function simScore(words,i,titleOnly){if(!words.length)return 0;const B=new Set(tok(titleOnly?both(i.title):both(i.title)+' '+both(i.desc)));let h=0;words.forEach(a=>{for(const b of B){if(a===b||(a.length>4&&b.length>4&&(a.startsWith(b)||b.startsWith(a)))){h++;break}}});return h/words.length}
/* Each result: [idea, shown score = max(title match, full-text match), full-text match]. Blocking uses the full-text match only. */
function findSimilar(title,desc){
 const wT=[...new Set(tok(title))],wA=[...new Set(tok(title+' '+desc))];if(!wT.length)return [];
 return S.ideas.map(i=>{const c=wA.length>=2?simScore(wA,i):0,t=wT.length>=2?simScore(wT,i,true):0;return [i,Math.max(c,t),c]}).filter(a=>a[1]>=SIM).sort((a,b)=>b[1]-a[1]).slice(0,3);

 const w=[...new Set(tok(title+' '+desc))].sort((a,b)=>b.length-a.length).slice(0,8),k=w.join(' ');if(!w.length||k===simKey)return simReq||Promise.resolve();simKey=k;
 /* Letters that are written several ways match any form; "*" = anything before or after */
 const pat=x=>'*'+x.replace(/[اأإآ]/g,'_').replace(/[هة]/g,'_').replace(/[يى]/g,'_')+'*';
 const or=w.flatMap(x=>[`title.ilike.${pat(x)}`,`description.ilike.${pat(x)}`]).join(',');
 return simReq=rest('GET',`ideas?select=${IDEA_COLS}&or=(${encodeURIComponent(or)})&order=yes_count.desc&limit=60`).then(async r=>{await mergeRows(r);applyFac()}).catch(e=>console.warn('tamanna similar',e)).finally(()=>{simReq=null})}

 const r=await fetch(`${SB.url}/storage/v1/object/idea-images/${path}`,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+at,'Content-Type':'image/jpeg'},body:blob});
 if(!r.ok)throw new Error('upload '+r.status);return `${SB.url}/storage/v1/object/public/idea-images/${path}`}

const grp=(arr,k)=>{const m={};(arr||[]).forEach(x=>{(m[x[k]]||(m[x[k]]=[])).push(x)});return m};
/* Factory data is read in full (page by page past 1000 rows), then attached to whichever ideas are loaded.
   When more ideas load later, applyFac() attaches the same data again without asking the database. */
let FACDATA=null;
async function liveLoadFac(){
 const [facs,makes,notes,lists]=await Promise.all([restAll('factories?select=handle,name,country,website&order=handle'),restAll('makes?select=id,idea_id,handle,factory_name,kind,created_at&order=created_at.asc,id.asc'),restAll('factory_notes?select=idea_id,handle,factory_name,body,verdict,updated_at&order=idea_id,handle'),
  restAll('listings?select=id,idea_id,handle,factory_name,price_cents,shipping_cents,handling_days,options,message,created_at&active=eq.true&order=created_at,id').catch(()=>[])]);
 FACTORIES.length=0;(facs||[]).forEach(f=>FACTORIES.push([f.handle,f.name]));
 let det=[],invs=[],thr=[],msgs=[];FAC=null;
 OFFICIAL=false;
 if(sess){const me=await rest('POST','rpc/my_factory',{});FAC=(me&&me[0])||null;if(FAC)S.me.factory=FAC.name;
  try{OFFICIAL=!!(await rest('POST','rpc/is_official',{}))}catch(e){}
  [det,invs,thr]=await Promise.all([rest('POST','rpc/my_make_details',{}),restAll('invites?select=idea_id,handle&order=idea_id,handle'),restAll('threads?select=id,idea_id,handle,factory_name,blocked,created_at&order=created_at,id')]);
  if((thr||[]).length)msgs=await restAll('messages?select=id,thread_id,sender,body,created_at&order=created_at.asc,id.asc')}
 FACDATA={det,makes,notes,invs,thr,msgs,lists};applyFac()}
/* A live listing becomes an "offer" in the shapes the selling screens already use. Prices are stored in EUR cents;
   the screens keep prices in USD and convert to each visitor's currency, so EUR is turned into USD here. eur/eurShip keep the exact charge. */
const listingOffer=l=>({id:l.id,live:true,fac:l.handle,factory:l.factory_name,price:l.price_cents/100/FX.EUR,shipping:l.shipping_cents/100/FX.EUR,cur:'EUR',eur:l.price_cents,eurShip:l.shipping_cents,handling:l.handling_days,options:parseOpts(l.options),msg:l.message||'',active:true,mode:'notify',at:Date.parse(l.created_at)});
function applyFac(){if(!FACDATA)return;const {det,makes,notes,invs,thr,msgs,lists}=FACDATA;
 const D=new Map((det||[]).map(d=>[d.id,d])),M=grp((makes||[]).filter(m=>m.kind!=='platform'),'idea_id'),N=grp(notes,'idea_id'),V=grp(invs,'idea_id'),TH=grp(thr,'idea_id'),MS=grp(msgs,'thread_id'),LS=grp(lists,'idea_id');
 S.me.facPriv=[];S.me.facPub=[];
 S.ideas.forEach(i=>{
  /* Latest maker is shown as the product; earlier outside makers stay as history. Proof link and message reach only the creator and that factory. */
  const ms=(M[i.id]||[]).map(m=>{const d=D.get(m.id)||{};return {id:m.id,fac:m.handle,factory:m.factory_name,proof:d.proof_url||'',msg:d.message||'',mode:'notify',at:Date.parse(m.created_at),handling:3}});
  i.priv=ms.length?ms[ms.length-1]:null;i.outside=ms.slice(0,-1);i.offers=(LS[i.id]||[]).map(listingOffer);
  if(FAC&&i.offers.some(o=>o.fac===FAC.handle))S.me.facPub.push(i.id);
  if(FAC&&ms.some(m=>m.fac===FAC.handle))S.me.facPriv.push(i.id);
  i.fnotes=(N[i.id]||[]).map(n=>({fac:n.handle,name:n.factory_name,text:n.body,at:Date.parse(n.updated_at),verdict:n.verdict||null}));
  i.invites=(V[i.id]||[]).map(v=>v.handle);
  i.threads=(TH[i.id]||[]).map(t=>({id:t.id,fac:t.handle,facName:t.factory_name,blocked:t.blocked,msgs:(MS[t.id]||[]).map(m=>({id:m.id,from:m.sender,text:m.body,at:Date.parse(m.created_at)}))}));
  sync(i);
 });
}

/* ---- "Original idea from Tamanna" QR badges ----
   The QR opens a certificate (#verify-CODE) naming only the licensed factory: never other or cheaper sellers.
   A plain idea-page QR (made by someone without a licence) shows no certificate. Licences are issued by
   officials (manually until payments are on). Fake-badge reports need a saved account, a purchase proof from
   that same store and a photo of the badge; officials verify against the licence list, then the proofs are deleted. */
const VERIFY_URL=c=>SHARE_BASE+'#verify-'+c;
async function pubRpc(fn,args){const r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})});if(!r.ok)throw new Error('http '+r.status);const t=await r.text();return t?JSON.parse(t):null}
const vBoxHTML=()=>`<form class="sug-f" data-form="verify"><input class="inp" name="c" placeholder="TM-XXXXXXXX" dir="ltr" autocomplete="off" spellcheck="false" required aria-label="${T('vCheck')}"><button class="btn sm">${T('vCheckBtn')}</button></form>`;
async function openVerify(code){openModal(`<p class="muted">…</p>`,'verify');let d=null;try{d=await pubRpc('verify_badge',{p_code:code})}catch(e){}if(UI.modal==='verify')$('#mc').innerHTML=verifyHTML(d)}
function verifyHTML(d){
 if(!d||d.status!=='active')return `<div class="cert bad"><h2>⚠️ ${T(d?'vRevT':'vBadT')}</h2><p>${T(d?'vRevD':'vBadD')}</p><b style="font-size:13.5px">${T('vCheck')}</b>${vBoxHTML()}<a class="link" href="#">${T('vHome')}</a></div>`;
 const i=d.idea,dt=new Intl.DateTimeFormat(LOC[S.me.lang]||'en',{year:'numeric',month:'long',day:'numeric'});
 return `<div class="cert ok"><span class="cert-seal">✓</span><h2>${T('vOkT')}</h2><p class="cert-fac">${T('vOkBy')(`<b>${esc(d.factory)}</b>`)}</p>
 ${i.image?`<img class="c-img" src="${esc(i.image)}" alt="">`:''}<h3>💡 ${esc(i.title)}</h3>
 <ul class="cert-l"><li>${T('vAuthor')}: <b>${i.author?esc(i.author):T('anon')}${i.official?' ✓':''}</b></li><li>${T('vPosted')}: ${dt.format(new Date(i.created))}</li><li>⭐ ${T('vWishes')(`<b class="tnum">${fmt(i.wishes)}</b>`)}</li><li>${T('vCode')}: <code dir="ltr">TM-${esc(d.code)}</code> · ${dt.format(new Date(d.issued))}</li></ul>
 <p class="muted" style="font-size:12.5px;line-height:1.6">${T('vNote')}</p><a class="btn sm" href="#">${T('vHome')}</a></div>`}
const badgeNoteHTML=i=>`<p class="badge-note">🏷️ ${T('bnText')} <button class="link" data-act="report" data-pid="${i.id}">${T('bnReport')}</button></p>`;
function reportHTML(i){if(!savedAcct())return `<h2>🚩 ${T('rpT')}</h2><p>${T('rpNeedAcct')}</p><button class="btn pri" data-act="acct-open" data-v="save">${T('acctSaveBtn')}</button>`;
 return `<h2>🚩 ${T('rpT')}</h2><p class="muted" style="font-size:13px">${esc(tx(i.title))}</p><p class="muted" style="font-size:13px;line-height:1.6">${T('rpIntro')}</p>
 <form class="edit" data-form="report" data-pid="${i.id}"><label class="fld">${T('rpStore')}<input name="store" required minlength="2" maxlength="120"></label>
 <label class="fld">${T('rpUrl')}<input name="url" type="url" dir="ltr" maxlength="300" placeholder="https://"></label>
 <label class="fld">🧾 ${T('rpProof')}<input name="proof" type="file" accept="image/*" required><small class="muted">${T('rpProofHint')}</small></label>
 <label class="fld">🏷️ ${T('rpBadge')}<input name="badge" type="file" accept="image/*" required></label>
 <label class="fld">${T('rpNote')}<textarea name="note" rows="2" maxlength="600"></textarea></label>
 <p class="err" id="rp-err" hidden></p><button class="btn pri wide">${T('rpSend')}</button></form>`}
async function upReport(path,file){const at=await token(),blob=await (await fetch(await readImg(file,1600,.8))).blob();const r=await fetch(`${SB.url}/storage/v1/object/reports/${path}`,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+at,'Content-Type':'image/jpeg'},body:blob});if(!r.ok)throw new Error('upload '+r.status)}
async function sendReport(f){const err=$('#rp-err'),btn=f.querySelector('button.pri'),fail=m=>{err.textContent=m;err.hidden=false;btn.disabled=false};err.hidden=true;btn.disabled=true;
 try{const id=crypto.randomUUID(),p=`${sess.uid}/${id}-proof.jpg`,b=`${sess.uid}/${id}-badge.jpg`;
  await upReport(p,f.proof.files[0]);await upReport(b,f.badge.files[0]);
  await rest('POST','badge_reports',{id,idea_id:f.dataset.pid,store_name:f.store.value.trim(),store_url:f.url.value.trim()||null,note:f.note.value.trim()||null,purchase_path:p,badge_path:b},'return=minimal');
  closeModal();toast(T('rpDone'))}catch(e){fail(/report_limit/.test(e.message||'')?T('rpLimit'):T('netErr'))}}
/* factory: my badges + downloadable badge image with QR (QR library is loaded only when needed) */
function loadQR(){return window.qrcode?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function myBadgesHTML(){let l=[];try{l=await rest('POST','rpc/my_licenses',{})||[]}catch(e){}
 /* ideas this factory makes that have no active badge yet: offer to buy one */
 const has=new Set(l.filter(x=>x.status==='active').map(x=>x.idea_id)),can=(S.me.facPriv||[]).map(byId).filter(i=>i&&!has.has(i.id));
 const buy=can.length?`<section class="adm"><h3>🛒 ${T('buyBadge')} · ${moneyIn(49,'EUR')}</h3><ul class="lic-l">${can.map(i=>`<li><b>${esc(tx(i.title))}</b><button class="btn sm pri" data-act="buy-badge" data-pid="${i.id}">${T('planBuy')}</button></li>`).join('')}</ul></section>`:'';
 return `<h2>🏷️ ${T('myBadges')}</h2>${buy}${l.length?`<ul class="lic-l">${l.map(x=>`<li><b>${esc(x.title)}</b><small class="muted" dir="ltr">TM-${esc(x.code)}</small>${x.status==='active'?`<button class="btn sm pri" data-act="badge-dl" data-c="${esc(x.code)}" data-w="${x.wishes}">⬇️ ${T('badgeDl')}</button>`:`<span class="late-t">${T('vRevT')}</span>`}</li>`).join('')}</ul>`:`<p class="muted">${T('noBadges')}</p><button class="btn sm" data-act="plans">📦 ${T('subL')}</button>`}`}
async function downloadBadge(code,wishes){await loadQR();const W=900,H=1150,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),F='system-ui,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif';
 x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);x.strokeStyle='#2E2A6E';x.lineWidth=14;x.strokeRect(7,7,W-14,H-14);
 const fit=(t,w,s,wt)=>{let z=s;do{x.font=`${wt} ${z}px ${F}`;z-=2}while(x.measureText(t).width>w&&z>18)};
 x.fillStyle='#2E2A6E';x.fillRect(0,0,W,170);x.fillStyle='#FBBF24';x.textAlign='center';fit('✓ Original idea from Tamanna',W-90,60,800);x.fillText('✓ Original idea from Tamanna',W/2,98);x.fillStyle='#FFFFFF';x.direction='rtl';fit('فكرة أصلية من تمنّى',W-90,42,700);x.fillText('فكرة أصلية من تمنّى',W/2,150);x.direction='ltr';
 x.fillStyle='#1B1A2E';if(+wishes>0){fit(`⭐ ${Number(wishes).toLocaleString('en')} people wished for it`,W-90,40,700);x.fillText(`⭐ ${Number(wishes).toLocaleString('en')} people wished for it`,W/2,240)}
 const q=qrcode(0,'M');q.addData(VERIFY_URL(code));q.make();const n=q.getModuleCount(),cell=Math.floor(600/n),sz=cell*n,ox=(W-sz)/2,oy=290;x.fillStyle='#1B1A2E';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(ox+k*cell,oy+r*cell,cell,cell);
 x.font=`800 46px ui-monospace,Consolas,monospace`;x.fillText('TM-'+code,W/2,oy+sz+75);x.fillStyle='#67667B';x.font=`500 34px ${F}`;x.fillText('Scan to verify  ·  امسح للتحقق',W/2,oy+sz+130);x.font=`600 28px ui-monospace,Consolas,monospace`;x.fillText('tamannaideas.github.io',W/2,H-40);
 const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`tamanna-badge-TM-${code}.png`;document.body.appendChild(a);a.click();a.remove()}
/* officials: issue licences, see all, review reports */
async function adminHTML(){let lic=[],reps=[];try{[lic,reps]=await Promise.all([rest('POST','rpc/all_licenses',{}),rest('GET','badge_reports?select=id,idea_id,store_name,store_url,note,purchase_path,badge_path,status,created_at&status=eq.pending&order=created_at.asc')])}catch(e){}
 const sign=async p=>{try{const r=await fetch(`${SB.url}/storage/v1/object/sign/reports/${p}`,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify({expiresIn:900})});const j=await r.json();return j.signedURL?SB.url+'/storage/v1'+j.signedURL:''}catch(e){return ''}};
 const R=await Promise.all((reps||[]).map(async r=>Object.assign(r,{pu:await sign(r.purchase_path),bu:await sign(r.badge_path)})));
 return `<h2>🏷️ ${T('adminT')}</h2>
 <section class="adm"><h3>${T('admIssue')}</h3><form class="edit" data-form="issue"><div class="two"><label class="fld">${T('admHandle')}<input name="h" required dir="ltr" placeholder="@factory"></label><label class="fld">${T('admIdea')}<input name="i" required dir="ltr" placeholder="https://tamannaideas.github.io/#idea-…"></label></div>
 <div class="two"><label class="fld">${T('admPrice')}<input name="p" type="number" min="0" step="0.01" required></label><label class="fld">${T('curL')}<select class="inp" name="c">${curOptions('EUR')}</select></label></div>
 <label class="fld">${T('admProof')}<input name="u" type="url" dir="ltr" placeholder="https://"></label><p class="err" id="adm-err" hidden></p><button class="btn pri">${T('admIssueBtn')}</button></form><div id="adm-out"></div></section>
 <section class="adm"><h3>${T('admReports')} (${fmt(R.length)})</h3>${R.length?R.map(r=>`<div class="rep"><b>🏪 ${esc(r.store_name)}</b>${r.store_url&&/^https?:\/\//i.test(r.store_url)?` <a class="link" dir="ltr" href="${esc(r.store_url)}" target="_blank" rel="noopener noreferrer">${esc(r.store_url.slice(0,60))} ↗</a>`:''}<small class="muted">${esc(tx((byId(r.idea_id)||{}).title)||'')} · ${ago(Date.parse(r.created_at))}</small>${r.note?`<p>${esc(r.note)}</p>`:''}<div class="rep-imgs"><a href="${r.pu}" target="_blank" rel="noopener noreferrer"><img src="${r.pu}" alt="${T('rpProof')}"><small>🧾 ${T('rpProof')}</small></a><a href="${r.bu}" target="_blank" rel="noopener noreferrer"><img src="${r.bu}" alt="${T('rpBadge')}"><small>🏷️ ${T('rpBadge')}</small></a></div><p class="muted" style="font-size:12.5px">${T('admHow')}</p><div class="row"><button class="btn sm danger" data-act="rep-decide" data-id="${r.id}" data-s="confirmed" data-p="${esc(r.purchase_path)}" data-b="${esc(r.badge_path)}">${T('admFake')}</button><button class="btn sm" data-act="rep-decide" data-id="${r.id}" data-s="rejected" data-p="${esc(r.purchase_path)}" data-b="${esc(r.badge_path)}">${T('admReject')}</button></div></div>`).join(''):`<p class="muted">${T('admNoReports')}</p>`}</section>
 <section class="adm"><h3>${T('admAll')} (${fmt((lic||[]).length)})</h3>${(lic||[]).length?`<ul class="lic-l">${lic.map(l=>`<li><b>${esc(l.title)}</b><small>${esc(l.factory)} <span dir="ltr">${esc(l.handle)}</span> · ${l.price!=null?esc(l.price+' '+(l.currency||'')):''}</small><small dir="ltr">TM-${esc(l.code)}</small>${l.status==='active'?`<button class="btn sm ghost" data-act="lic-revoke" data-c="${esc(l.code)}">${T('admRevoke')}</button>`:`<span class="late-t">${T('vRevT')}</span>`}</li>`).join('')}</ul>`:`<p class="muted">—</p>`}</section>`}

const TERMS_AR=`<h2>📄 شروط الاستخدام والخصوصية</h2><p class="muted">آخر تحديث: ٢٤ نوفمبر ٢٠٢٦</p>
<h3>١. عن تمنّى</h3><p>تمنّى (Tamanna) منصة ينشر فيها الناس منتجات يتمنون وجودها، ويصوّت عليها الآخرون، وتصنعها المصانع. المنصة مسجلة وتُدار من هولندا. باستخدامك الموقع فأنت توافق على هذه الشروط.</p>
<h3>٢. الأفكار مفتوحة</h3><p>عند نشرك فكرة فأنت توافق أنها <b>فكرة مفتوحة</b>: يحق لأي مصنع تصنيعها وبيعها، ولا تترتب لك عليها حقوق ملكية فكرية أو مطالبات مالية. لا تنشر فكرة تملك عليها براءة اختراع أو سراً تجارياً تريد حمايته.</p>
<h3>٣. المحتوى المسموح</h3><p>أنت مسؤول عما تنشره. يُمنع المحتوى المسيء أو غير القانوني أو المضلل، وانتحال شخصية أي جهة، واستخدام الأسماء المحجوزة مثل «Tamanna Team» أو ما يشبه اسم «تمنّى». يحق لنا حذف أي محتوى مخالف.</p>
<h3>٤. بيانات الموقع والاستخدام التجاري</h3><p>الأفكار والأصوات والأرقام وكل بيانات الموقع تُعرض للتصفح الشخصي. <b>يُمنع جمع بيانات الموقع أو نسخها أو تحليلها بطريقة آلية</b> (برامج الزحف أو الكشط أو الواجهات البرمجية) <b>أو استخدامها لأغراض تجارية</b>، إلا عبر <b>حساب مصنع</b> وبموجب هذه الشروط. يحق لنا إيقاف أي حساب أو وصول مخالف واتخاذ الإجراءات القانونية.</p>
<h3>٥. المصانع والبيع</h3><ul><li>البائع الحقيقي هو المصنع، وهو المسؤول عن منتجه وجودته وسلامته ومطابقته للقوانين.</li><li>يُحاسَب المنتج على <b>الوصف الأصلي للفكرة</b> وقت التصنيع، أو على «ملاحظة المصنع» التي وافق عليها صاحب الفكرة.</li><li>على المصنع الشحن خلال المدة المحددة، وإلا يُسترد المبلغ للمشتري تلقائياً وتُسجَّل مخالفة، وتتكرر العقوبات حتى الإيقاف أو الإزالة.</li><li>عمولة المنصة <b>5%</b> على كل بيع داخل تمنّى.</li><li>يُمنع إزعاج أصحاب الأفكار، وتُطبَّق حدود المحادثات حسب الباقة.</li></ul>
<h3>٦. المشترون والإرجاع</h3><p>يحق للمشتري في الاتحاد الأوروبي الإرجاع خلال <b>14 يوماً</b> من الاستلام وفق القانون. وإذا خالف المنتج الوصف المعتمد، يحق له إرجاعه واسترداد المبلغ وتكون تكلفة الإرجاع على المصنع.</p>
<h3>٧. دور تمنّى</h3><p>تمنّى <b>وسيط</b> يربط الناس بالمصانع، وليست طرفاً في عقد البيع. نبذل جهدنا لحماية الطرفين بقواعد تلقائية، ولا نضمن أي منتج يصنعه طرف آخر.</p>
<h3>٨. الخصوصية</h3><ul><li>تتصفح وتنشر بدون حساب؛ نحفظ في جهازك رمزاً يربطك بأفكارك وأصواتك.</li><li>إذا حفظت حسابك، نحفظ <b>إيميلك</b> لتسجيل الدخول والإشعارات فقط، و<b>لا يظهر لأي أحد</b>.</li><li>للمصانع: الاسم والدولة والموقع الإلكتروني تظهر للعامة، والإيميل لا يظهر.</li><li>عنوان الشحن يراه فقط المصنع الذي اشتريت منه.</li><li>بياناتنا محفوظة في خوادم داخل <b>الاتحاد الأوروبي</b>، ولا نبيع بياناتك الشخصية لأحد.</li><li>من حقك طلب نسخة من بياناتك أو حذفها في أي وقت عبر التواصل معنا.</li></ul>
<h3>٩. التعديلات والقانون</h3><p>قد نحدّث هذه الشروط، ونوضح تاريخ آخر تحديث أعلاه. يخضع استخدام الموقع لقوانين <b>هولندا</b>. للتواصل: <span dir="ltr">alwsabi1@hotmail.com</span></p>`;
const TERMS_EN=`<h2>📄 Terms of Use & Privacy</h2><p class="muted">Last updated: 24 November 2026. This English version prevails over translations.</p>
<h3>1. About Tamanna</h3><p>Tamanna is a platform where people post products they wish existed, others vote on them, and factories make them. It is run from the Netherlands. By using the site you agree to these terms.</p>
<h3>2. Ideas are open</h3><p>By posting an idea you agree it is an <b>open idea</b>: any factory may make and sell it, and you gain no intellectual-property rights or financial claims over it. Don’t post anything you hold a patent or trade secret on.</p>
<h3>3. Allowed content</h3><p>You are responsible for what you post. Abusive, illegal or misleading content, impersonation, and reserved names such as “Tamanna Team” or anything resembling “Tamanna” are not allowed. We may remove any content that breaks these rules.</p>
<h3>4. Site data and commercial use</h3><p>Ideas, votes, numbers and all site data are shown for personal browsing. <b>Collecting, copying or analysing site data by automated means</b> (crawlers, scrapers or APIs) <b>or using it for commercial purposes</b> is prohibited, except through a <b>factory account</b> under these terms. We may suspend any infringing account or access and take legal action.</p>
<h3>5. Factories and selling</h3><ul><li>The factory is the actual seller and is responsible for its product, its quality, safety and legal compliance.</li><li>A product is judged against the <b>idea’s original description</b> at the time of manufacture, or against a factory note approved by the idea’s creator.</li><li>Factories must ship within the stated time; otherwise the buyer is refunded automatically and a strike is recorded, escalating to suspension or removal.</li><li>The platform commission is <b>5%</b> of every sale made on Tamanna.</li><li>Spamming creators is prohibited; conversation limits apply per plan.</li></ul>
<h3>6. Buyers and returns</h3><p>Buyers in the EU may return a product within <b>14 days</b> of delivery as provided by law. If a product doesn’t match the approved description, the buyer may return it for a refund and the factory pays the return costs.</p>
<h3>7. Tamanna’s role</h3><p>Tamanna is an <b>intermediary</b> connecting people and factories and is not a party to the sale. We protect both sides with automatic rules but do not guarantee products made by third parties.</p>
<h3>8. Privacy</h3><ul><li>You can browse and post without an account; a token stored on your device links you to your ideas and votes.</li><li>If you save your account, we store your <b>email</b> only for login and notifications; it is <b>never shown to anyone</b>.</li><li>For factories, name, country and website are public; the email is not.</li><li>A shipping address is seen only by the factory you bought from.</li><li>Data is stored on servers inside the <b>European Union</b>, and we never sell personal data.</li><li>You may request a copy of your data or its deletion at any time by contacting us.</li></ul>
<h3>9. Changes and law</h3><p>We may update these terms and show the last-updated date above. Use of the site is governed by the laws of <b>the Netherlands</b>. Contact: <span dir="ltr">alwsabi1@hotmail.com</span></p>`;

   PAY_ON is switched on together with Mollie: paying then opens Mollie's checkout and the webhook completes the order.
   Until then the pay button says "soon". With ?paytest=1 the owner can create test orders and officials can complete
   them with a test payment, to try the whole flow. ---- */
const PAY_ON=false,PAY_TEST=LIVE&&new URLSearchParams(location.search).has('paytest');
let FACPLAN=null;

async function facOrders(){try{return await rest('GET','orders?select=id,kind,item,amount_cents,status,created_at,paid_at&order=created_at.desc&limit=20')||[]}catch(e){return []}}
const planName=k=>(T('plans')[k]||{}).n||k;

 return `<button class="btn sm ${k==='pro'?'pri':''}" data-act="buy-plan" data-v="${k}">${cur===k?T('planRenew'):T('planBuy')}</button>${k==='biz'&&cur==='biz'?` <button class="btn sm ghost" data-act="buy-seats">${T('seatsBuy')}</button>`:''}`}
function facOrdersHTML(l){if(!l||!l.length)return '';const st=s=>T('ordSt')[s]||s,what=o=>o.kind==='plan'?planName(o.item.plan):o.kind==='seats'?T('seatsBuy'):o.kind==='badge'?'🏷️ '+T('qrT'):'🚀 '+T('promoT');

async function pwRecovered(p){
 if(p.get('error')||!p.get('access_token')){toast(T('pwLinkBad'));return}
 try{const at=p.get('access_token'),r=await fetch(SB.url+'/auth/v1/user',{headers:{apikey:SB.key,Authorization:'Bearer '+at}});const user=await r.json();if(!r.ok||!user.id)throw new Error('user');
  keepSess({access_token:at,refresh_token:p.get('refresh_token'),expires_in:+p.get('expires_in')||3600,user});save();
  openModal(pwNewHTML(),'pw-new')}catch(e){toast(T('pwLinkBad'))}}

 const btn=f.querySelector('button.pri');btn.disabled=true;
 if(k==='pw-forgot'){const err=$('#pf-err'),ok=$('#pf-ok');err.hidden=true;
  try{await authReq('recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:f.email.value.trim()});
   /* same answer whether or not the email has an account, so nobody can test which emails are registered */
   ok.textContent=T('pwSent');ok.hidden=false;f.email.disabled=true}
  catch(x){err.textContent=/rate|seconds|too many/i.test(x.message||'')?T('pwWait'):T('netErr');err.hidden=false;btn.disabled=false}return}
 const err=$('#pn-err');err.hidden=true;
 try{const at=await token(),r=await fetch(SB.url+'/auth/v1/user',{method:'PUT',headers:{apikey:SB.key,Authorization:'Bearer '+at,'Content-Type':'application/json'},body:JSON.stringify({password:f.pw.value})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_code||j.message||'http '+r.status);
  closeModal();toast(T('pwDone'));await liveRefresh()}
 catch(x){err.textContent=/same|different/i.test(x.message||'')?T('pwSame'):/password|weak/i.test(x.message||'')?T('pwHint'):T('netErr');err.hidden=false;btn.disabled=false}});

async function acctSubmit(f){const save=f.dataset.mode==='save',err=$('#ac-err'),btn=f.querySelector('button.pri'),fail=m=>{err.textContent=m;err.hidden=false;btn.disabled=false};err.hidden=true;btn.disabled=true;
 const email=f.email.value.trim(),pw=f.pw.value;
 try{
  if(save){
   const at=await token();
   const r=await fetch(SB.url+'/auth/v1/user',{method:'PUT',headers:{apikey:SB.key,Authorization:'Bearer '+at,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
   const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_code||j.message||('http '+r.status));
   keepSess(await authReq('token?grant_type=refresh_token',{refresh_token:sess.rt}));
  }else{
   const prevVotes=Object.assign({},S.me.votes),prevReacts=Object.assign({},S.me.reacts),keys=Object.values(S.me.keys||{}),old=sess&&sess.anon?Object.assign({},sess):null;
   keepSess(await authReq('token?grant_type=password',{email,password:pw}));
   /* the temporary device account's own wishes/likes are removed after the merge, so nothing is counted twice */
   const dropOld=async()=>{if(!old||!old.uid||old.uid===sess.uid)return;const h={apikey:SB.key,Authorization:'Bearer '+old.at};for(const t of ['votes','reactions'])await fetch(`${SB.url}/rest/v1/${t}?user_id=eq.${old.uid}`,{method:'DELETE',headers:h}).catch(()=>{})};
   /* merge this device's activity into the account */
   const [sv,sr]=await Promise.all([rest('GET','votes?select=idea_id'),rest('GET','reactions?select=idea_id')]);const hv=new Set((sv||[]).map(x=>x.idea_id)),hr=new Set((sr||[]).map(x=>x.idea_id));
   for(const [id,v] of Object.entries(prevVotes))if(!hv.has(id)&&byId(id))await rest('POST','votes?on_conflict=idea_id,user_id',{idea_id:id,value:v},'resolution=merge-duplicates,return=minimal').catch(()=>{});
   for(const [id,v] of Object.entries(prevReacts))if(v&&!hr.has(id)&&byId(id))await rest('POST','reactions?on_conflict=idea_id,user_id',{idea_id:id,value:v},'resolution=merge-duplicates,return=minimal').catch(()=>{});
   for(const k of keys)if(k)await rest('POST','rpc/claim_idea',{p_key:k}).catch(()=>{});
   await dropOld();
  }
  await liveLoad();closeModal();render();toast(save?T('acctSavedT'):T('facHi'));
 }catch(e){const s=e.message||'';fail(/already|exists|registered/i.test(s)?T('emailTaken'):/invalid login|invalid credentials/i.test(s)?T('authBad'):/password|weak/i.test(s)?T('pwHint'):/email/i.test(s)?T('acctBadEmail'):T('netErr'))}}
